[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amularr"
version = "0.2.2"
description = "Torznab indexer and download-client bridge between the *arr stack and aMule (ed2k/Kad)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-2.0-or-later" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
amularr = "amularr.cli:main"

[tool.setuptools.packages.find]
include = ["amularr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
