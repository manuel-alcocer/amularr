<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fed"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e9e5b"/>
    </marker>
  </defs>
  <rect width="920" height="400" rx="16" fill="#f7f8fa"/>

  <!-- left column: the *arr apps -->
  <rect x="30" y="70" width="220" height="64" rx="10" fill="#ffffff" stroke="#c9ced6"/>
  <text x="140" y="97" text-anchor="middle" font-weight="600" fill="#1f2530">Prowlarr</text>
  <text x="140" y="118" text-anchor="middle" fill="#5b6472" font-size="12">sees it as a Torznab indexer</text>

  <rect x="30" y="200" width="220" height="64" rx="10" fill="#ffffff" stroke="#c9ced6"/>
  <text x="140" y="227" text-anchor="middle" font-weight="600" fill="#1f2530">Sonarr · Radarr</text>
  <text x="140" y="248" text-anchor="middle" fill="#5b6472" font-size="12">see it as a qBittorrent client</text>

  <!-- center: amularr -->
  <rect x="330" y="40" width="240" height="250" rx="14" fill="#eaf1ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="450" y="72" text-anchor="middle" font-size="22" font-weight="700" fill="#2f6fed">amularr</text>

  <rect x="350" y="92" width="200" height="70" rx="8" fill="#ffffff" stroke="#9db8f5"/>
  <text x="450" y="116" text-anchor="middle" font-weight="600" fill="#1f2530">Torznab indexer</text>
  <text x="450" y="136" text-anchor="middle" fill="#5b6472" font-size="12">/api</text>
  <text x="450" y="152" text-anchor="middle" fill="#5b6472" font-size="12">ed2k result → fake torrent (magnet)</text>

  <rect x="350" y="176" width="200" height="70" rx="8" fill="#ffffff" stroke="#9db8f5"/>
  <text x="450" y="200" text-anchor="middle" font-weight="600" fill="#1f2530">qBittorrent API</text>
  <text x="450" y="220" text-anchor="middle" fill="#5b6472" font-size="12">/api/v2</text>
  <text x="450" y="236" text-anchor="middle" fill="#5b6472" font-size="12">magnet → ed2k link in aMule</text>

  <text x="450" y="272" text-anchor="middle" fill="#2f6fed" font-size="12">native EC protocol, no amulecmd</text>

  <!-- right: aMule -->
  <rect x="700" y="100" width="190" height="130" rx="10" fill="#ffffff" stroke="#c9ced6"/>
  <text x="795" y="132" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2530">aMule</text>
  <text x="795" y="156" text-anchor="middle" fill="#5b6472" font-size="12">ed2k / Kad network</text>
  <text x="795" y="176" text-anchor="middle" fill="#5b6472" font-size="12">searches and downloads</text>
  <text x="795" y="210" text-anchor="middle" fill="#5b6472" font-size="12">forgets finished files on restart</text>

  <!-- arrows: apps -> amularr -->
  <line x1="250" y1="102" x2="348" y2="118" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="290" y="96" text-anchor="middle" fill="#5b6472" font-size="12">search</text>
  <line x1="250" y1="232" x2="348" y2="216" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="276" y="209" text-anchor="middle" fill="#5b6472" font-size="11">download · status · delete</text>

  <!-- arrows: amularr <-> aMule (EC) -->
  <line x1="572" y1="150" x2="698" y2="150" stroke="#2f6fed" stroke-width="2" marker-end="url(#arrow-accent)" marker-start="url(#arrow-accent)"/>
  <text x="635" y="140" text-anchor="middle" fill="#2f6fed" font-size="12" font-weight="600">EC · 4712</text>
  <text x="635" y="172" text-anchor="middle" fill="#2f6fed" font-size="11">search, add link,</text>
  <text x="635" y="187" text-anchor="middle" fill="#2f6fed" font-size="11">download queue</text>

  <!-- bottom: Incoming folder shared with Sonarr/Radarr -->
  <line x1="795" y1="232" x2="795" y2="318" stroke="#2e9e5b" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="650" y="320" width="240" height="48" rx="10" fill="#e8f6ee" stroke="#2e9e5b"/>
  <text x="770" y="341" text-anchor="middle" font-weight="600" fill="#1f2530">Incoming directory</text>
  <text x="770" y="358" text-anchor="middle" fill="#5b6472" font-size="12">mounted in aMule, amularr and Sonarr/Radarr</text>
  <path d="M 648 344 L 140 344 L 140 266" fill="none" stroke="#2e9e5b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-green)"/>
  <text x="395" y="336" text-anchor="middle" fill="#2e9e5b" font-size="12" font-weight="600">Sonarr/Radarr import the finished file into the library</text>
</svg>
